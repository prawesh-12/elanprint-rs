[workspace]
resolver = "2"
members = ["crates/elanprint-usb", "crates/elanprint-proto", "crates/elanprint-store", "crates/elanprint-algo", "crates/elanprint-cli", "crates/elanprintd", "crates/elanprint-login", "crates/pam-elanprint-keyring", "crates/elanprint-keyring-setup"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
nusb = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tokio-util = "0.7"
zbus = { version = "4", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
egui = "0.32"
futures-util = "0.3"
zeroize = "1"

elanprint-usb = { path = "crates/elanprint-usb" }
elanprint-proto = { path = "crates/elanprint-proto" }
elanprint-store = { path = "crates/elanprint-store" }
elanprint-algo = { path = "crates/elanprint-algo" }
elanprintd = { path = "crates/elanprintd" }
elanprint-keyring-setup = { path = "crates/elanprint-keyring-setup" }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
