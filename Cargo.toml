[workspace]
resolver = "2"
members = ["crates/elanmoc-usb", "crates/elanmoc-proto", "crates/elanmoc-store", "crates/elanmoc-algo", "crates/elanmoc-cli", "crates/elanmocd"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
nusb = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = "0.7"
zbus = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"

elanmoc-usb = { path = "crates/elanmoc-usb" }
elanmoc-proto = { path = "crates/elanmoc-proto" }
elanmoc-store = { path = "crates/elanmoc-store" }
elanmoc-algo = { path = "crates/elanmoc-algo" }
elanmocd = { path = "crates/elanmocd" }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
